# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup iOS CI workspace
description: >-
  Select released Xcode, optionally install Flutter/Ruby/Brewfile tools, and
  restore SPM / DerivedData / Flutter embed caches (flutter_bloc_app composite
  action pattern adapted for Xcode).

inputs:
  flutter:
    description: Install Flutter stable via subosito/flutter-action
    required: false
    default: "false"
  ruby:
    description: Set up Ruby 3.3 with bundler-cache
    required: false
    default: "false"
  brewfile:
    description: Install Brewfile lint/build-phase tools
    required: false
    default: "false"
  brew-packages:
    description: >-
      Comma-separated Homebrew packages to install instead of the full Brewfile
      (e.g. ripgrep). Ignored when brewfile=true.
    required: false
    default: ""
  cache-key-suffix:
    description: Distinguishes cache namespaces (iphone-build, platform, lint)
    required: false
    default: "default"
  derived-data-paths:
    description: Extra DerivedData paths to include in the Xcode cache
    required: false
    default: ""
  cache-flutter-embed:
    description: Include ./Flutter embed frameworks in the cache
    required: false
    default: "false"
  select-xcode:
    description: Run tool/select_xcode.sh (set false when caller already selected)
    required: false
    default: "true"

outputs:
  flutter-embed-cache-hit:
    description: True only when the exact Flutter embed input key was restored
    value: ${{ steps.flutter-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Select latest released Xcode
      if: ${{ inputs.select-xcode == 'true' }}
      shell: bash
      env:
        CI: true
      run: source ./tool/select_xcode.sh

    - name: Set up Ruby
      if: ${{ inputs.ruby == 'true' }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "3.3"
        bundler-cache: true

    - name: Set up Flutter
      if: ${{ inputs.flutter == 'true' }}
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    # Prefer shell digests over hashFiles(): GHA's hashFiles has a hard 120s
    # template timeout and failed iPhone-build when background simctl boot
    # contended disk I/O (run 37591436293: hashFiles('Brewfile') timeout).
    # Keep bash 3.2-safe (macOS runner /bin/bash) — no mapfile.
    - name: Compute cache key digests
      id: digests
      shell: bash
      run: |
        set -euo pipefail
        digest_paths_from_stdin() {
          # stdin: one relative path per line. Empty input → fixed sentinel.
          local hashes
          hashes="$(while IFS= read -r path || [[ -n "${path}" ]]; do
            [[ -n "${path}" && -f "${path}" ]] || continue
            shasum -a 256 "${path}"
          done)"
          if [[ -z "${hashes}" ]]; then
            printf '%s\n' "empty"
            return 0
          fi
          printf '%s\n' "${hashes}" | shasum -a 256 | awk '{print $1}'
        }

        brew_hash="none"
        if [[ -f Brewfile ]]; then
          brew_hash="$(shasum -a 256 Brewfile | awk '{print $1}')"
        fi
        echo "brew=${brew_hash}" >> "$GITHUB_OUTPUT"

        spm_hash="$(
          find . -name Package.resolved -type f | LC_ALL=C sort | digest_paths_from_stdin
        )"
        echo "spm=${spm_hash}" >> "$GITHUB_OUTPUT"

        spm_flutter_hash="$(
          {
            # Include tests, assets, manifests and preparation logic, not just Dart lib.
            git ls-files flutter_module | LC_ALL=C sort
            printf '%s\n' "tool/prepare_flutter_embed.sh"
            find . -name Package.resolved -type f | LC_ALL=C sort
          } | digest_paths_from_stdin
        )"
        echo "spm_flutter=${spm_flutter_hash}" >> "$GITHUB_OUTPUT"

    - name: Cache Homebrew downloads
      if: ${{ inputs.brewfile == 'true' || inputs.brew-packages != '' }}
      uses: actions/cache@v6
      with:
        path: |
          ~/Library/Caches/Homebrew
          ~/Library/Caches/Homebrew/downloads
        key: >-
          brew-${{ runner.os }}-${{ runner.arch }}-${{ steps.digests.outputs.brew }}-${{ inputs.brew-packages }}
        restore-keys: |
          brew-${{ runner.os }}-${{ runner.arch }}-

    # Cache SPM + Flutter embed only — full DerivedData restores were multi‑minute
    # and dominated setup (observed ~7m) without enough compile payoff on critical path.
    - name: Cache SwiftPM + Flutter embed
      id: flutter-cache
      if: ${{ inputs.cache-flutter-embed == 'true' }}
      uses: actions/cache@v6
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          Flutter
        key: >-
          xcode27-spm-flutter-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-suffix }}-${{ steps.digests.outputs.spm_flutter }}
        # Compiled Flutter/App frameworks require an exact source key. A partial
        # restore must never silently skip rebuilding changed Dart or assets.

    - name: Cache SwiftPM
      if: ${{ inputs.cache-flutter-embed != 'true' }}
      uses: actions/cache@v6
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
        key: >-
          xcode27-spm-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-suffix }}-${{ steps.digests.outputs.spm }}
        restore-keys: |
          xcode27-spm-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-key-suffix }}-

    - name: Install Brewfile tools
      if: ${{ inputs.brewfile == 'true' }}
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: brew bundle check --file Brewfile || brew bundle --file Brewfile

    # brew bundle check accepts any installed SwiftFormat; pin gate needs the
    # exact EXPECTED_SWIFTFORMAT_VERSION (lint vs iPhone-build runner drift).
    - name: Enforce SwiftFormat pin
      if: ${{ inputs.brewfile == 'true' }}
      shell: bash
      env:
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: ./tool/ensure_lint_tool_pins.sh

    - name: Install lean Homebrew packages
      if: ${{ inputs.brewfile != 'true' && inputs.brew-packages != '' }}
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
        BREW_PACKAGES: ${{ inputs.brew-packages }}
      run: |
        set -euo pipefail
        IFS=',' read -r -a pkgs <<<"$BREW_PACKAGES"
        for pkg in "${pkgs[@]}"; do
          pkg="$(echo "$pkg" | tr -d '[:space:]')"
          [[ -n "$pkg" ]] || continue
          if brew list --versions "$pkg" >/dev/null 2>&1; then
            echo "==> brew package present: $pkg"
          else
            echo "==> brew install $pkg"
            brew install "$pkg"
          fi
        done
