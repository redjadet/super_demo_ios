name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install lint tools
        run: brew bundle check --file Brewfile || brew bundle --file Brewfile

      - name: Lint
        env:
          CI: true
        run: bundle exec fastlane ci_lint

  iphone-test:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache Xcode + SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ${{ runner.temp }}/DerivedData-iPhone
          key: >-
            xcode-${{ runner.os }}-${{ runner.arch }}-iphone-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}

      - name: Install lint tools (for build phases)
        run: brew bundle check --file Brewfile || brew bundle --file Brewfile

      - name: iPhone tests
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          IPHONE_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-iPhone
        run: ./bin/ci-iphone-test.sh

  platform-builds:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Cache Xcode + SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ${{ runner.temp }}/DerivedData-iPad
            ${{ runner.temp }}/DerivedData-Mac
          key: >-
            xcode-${{ runner.os }}-${{ runner.arch }}-platform-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj') }}

      - name: Install lint tools (for build phases)
        run: brew bundle check --file Brewfile || brew bundle --file Brewfile

      - name: iPad and Mac builds
        env:
          CI: true
          CI_PREPARE_IPHONE: "0"
          CI_SERIAL_PLATFORM_BUILDS: "0"
          IPAD_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-iPad
          MAC_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-Mac
        run: ./bin/ci-platform-builds.sh

  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, iphone-test, platform-builds]
    if: ${{ always() }}
    steps:
      - name: Check CI lanes
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "lint failed or did not complete"
            exit 1
          fi
          if [[ "${{ needs['iphone-test'].result }}" != "success" ]]; then
            echo "iphone-test failed or did not complete"
            exit 1
          fi
          if [[ "${{ needs['platform-builds'].result }}" != "success" ]]; then
            echo "platform-builds failed or did not complete"
            exit 1
          fi
          echo "CI lanes passed."
