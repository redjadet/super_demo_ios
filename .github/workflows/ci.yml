name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.5
        run: ./tool/select_xcode_26_5.sh

      - name: Install lint tools
        run: brew bundle --file Brewfile

      - name: Prepare iOS Simulator
        env:
          CI: true
        run: ./tool/ensure_ci_simulator.sh

      - name: CI (lint, iPhone test, parallel iPad/Mac builds)
        env:
          CI: true
        run: ./bin/ci.sh
