name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Newest released Xcode on the xcode-27 image (GM build preferred over seed/beta).
  # Escape: runs-on macos-26 + SUPER_DEMO_XCODE_MIN_VERSION=26.5 (see docs/ci-cd-map.md).
  SUPER_DEMO_XCODE_MIN_VERSION: "27"

jobs:
  # Delivery checklist (Flutter ./bin/checklist role), parallelized for macos runners.
  # Local single-command equivalent: ./bin/checklist
  # Docs: docs/engineering/checklist_gate.md
  lint:
    name: Checklist · lint
    runs-on: xcode-27
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest released Xcode
        env:
          CI: true
        run: source ./tool/select_xcode.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install lint tools
        run: brew bundle check --file Brewfile || brew bundle --file Brewfile

      - name: Lint (Swift + markdown + DesignMD + common)
        env:
          CI: true
        run: bundle exec fastlane ci_lint

  iphone-test:
    name: Checklist · iPhone test
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest released Xcode
        env:
          CI: true
        run: source ./tool/select_xcode.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Xcode + SwiftPM + Flutter frameworks
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ${{ runner.temp }}/DerivedData-iPhone
            Flutter
          key: >-
            xcode27-${{ runner.os }}-${{ runner.arch }}-iphone-flutter-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj', 'flutter_module/pubspec.lock', 'flutter_module/lib/**') }}

      - name: Install lint tools (for build phases)
        run: brew bundle check --file Brewfile || brew bundle --file Brewfile

      - name: Prepare Flutter add-to-app frameworks
        run: |
          if [[ -d Flutter/Debug/Flutter.xcframework ]]; then
            ./tool/prepare_flutter_embed.sh --skip-build
          else
            ./tool/prepare_flutter_embed.sh
          fi
          (cd flutter_module && flutter test)

      - name: iPhone tests (warnings as errors)
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          # Concrete newest-runtime iPhone simulator + xcodebuild test (not generic build-only).
          CI_IPHONE_GENERIC_BUILD: "0"
          # Single attempt (no hard-timeout full-suite retry). Leave headroom under job 90m.
          CI_IPHONE_XCODEBUILD_TIMEOUT_SECONDS: "3600"
          IPHONE_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-iPhone
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-iphone-test.sh

  platform-builds:
    name: Checklist · platform builds
    runs-on: xcode-27
    timeout-minutes: 75
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest released Xcode
        env:
          CI: true
        run: source ./tool/select_xcode.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Xcode + SwiftPM + Flutter frameworks
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ${{ runner.temp }}/DerivedData-iPad
            ${{ runner.temp }}/DerivedData-Mac
            Flutter
          key: >-
            xcode27-${{ runner.os }}-${{ runner.arch }}-platform-flutter-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.pbxproj', 'flutter_module/pubspec.lock', 'flutter_module/lib/**') }}

      - name: Install lint tools (for build phases)
        run: brew bundle check --file Brewfile || brew bundle --file Brewfile

      - name: Prepare Flutter add-to-app frameworks (iPad; Mac skips link)
        run: |
          if [[ -d Flutter/Debug/Flutter.xcframework ]]; then
            ./tool/prepare_flutter_embed.sh --skip-build
          else
            ./tool/prepare_flutter_embed.sh
          fi

      - name: iPad and Mac builds (warnings as errors)
        env:
          CI: true
          CI_PREPARE_IPHONE: "0"
          CI_SERIAL_PLATFORM_BUILDS: "0"
          IPAD_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-iPad
          MAC_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-Mac
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-platform-builds.sh

  checklist:
    name: Delivery checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, iphone-test, platform-builds]
    if: ${{ always() }}
    steps:
      - name: Check checklist lanes
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "checklist lane failed: lint"
            exit 1
          fi
          if [[ "${{ needs['iphone-test'].result }}" != "success" ]]; then
            echo "checklist lane failed: iphone-test"
            exit 1
          fi
          if [[ "${{ needs['platform-builds'].result }}" != "success" ]]; then
            echo "checklist lane failed: platform-builds"
            exit 1
          fi
          echo "Delivery checklist gate passed (lint + iphone-test + platform-builds)."
          echo "Local equivalent: ./bin/checklist — see docs/engineering/checklist_gate.md"
