name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR pushes only — never cancel in-progress main runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Newest released Xcode on the xcode-27 image (GM build preferred over seed/beta).
  # Escape: runs-on macos-26 + SUPER_DEMO_XCODE_MIN_VERSION=26.5 (see docs/ci-cd-map.md).
  SUPER_DEMO_XCODE_MIN_VERSION: "27"
  CI_SIMULATOR_REUSE_ONLY: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  # Scope / preflight (flutter_bloc_app `changes` job parity).
  # iphone_layout is an output (not job-level env.if — GHA forbids env in job if).
  # single = one job (build-for-testing + parallel tests; no artifact handoff).
  # sharded = units in build job + ui-a/ui-b shards (compare / fallback).
  changes:
    name: Checklist · changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      iphone_layout: ${{ steps.scope.outputs.iphone_layout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          docs_only="$(./bin/checklist --print-scope)"
          case "$docs_only" in
            docs_only=true|docs_only=false) ;;
            *) echo "Invalid checklist scope: $docs_only" >&2; exit 1 ;;
          esac
          docs_only="${docs_only#docs_only=}"
          # Flip to "sharded" here to A/B the units-in-build + ui-a/ui-b layout.
          iphone_layout="single"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "iphone_layout=$iphone_layout" >> "$GITHUB_OUTPUT"
          {
            echo "## Change scope"
            echo ""
            echo "- event: \`${{ github.event_name }}\`"
            echo "- docs_only: \`$docs_only\`"
            echo "- iphone_layout: \`$iphone_layout\`"
            echo "- rule: \`tool/checklist_scope.sh\` (markdown/mdx/rst/adoc + llms.txt)"
            echo "- unknown/empty/mixed/code/workflow diffs take the full route"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Checklist · lint
    needs: changes
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Docs-only lint (no Brewfile / SwiftLint / Xcode)
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          set -euo pipefail
          if ! command -v npm >/dev/null 2>&1 && ! command -v npx >/dev/null 2>&1; then
            echo "error: npx required for DesignMD on docs-only lint" >&2
            exit 1
          fi
          ./bin/lint-markdown.sh
          ./tool/check_design_md.sh
          ./tool/check_checklist_scope.sh
          echo "Docs-only lint route passed."

      - name: Setup iOS CI (Ruby + Brewfile)
        if: needs.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-ios-ci
        with:
          ruby: "true"
          brewfile: "true"
          cache-key-suffix: lint

      - name: Lint (Swift + markdown + DesignMD + common)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
        run: bundle exec fastlane ci_lint

  # --- Layout: single (default) — build + test on one runner ---------------
  # Boots the simulator in the background during setup/Flutter/build so boot
  # is off the critical path, then runs the full suite with parallel workers
  # (simulator clones) — no cross-job artifact round-trip.
  iphone:
    name: Checklist · iPhone
    needs: changes
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.iphone_layout == 'single')
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docs-only iPhone bypass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only diff; iPhone build/test has no code to prove."

      - name: Select Xcode + pick existing simulator + start background boot
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
          CI_SIMULATOR_REUSE_ONLY: "1"
        run: |
          set -euo pipefail
          source ./tool/select_xcode.sh
          source ./tool/ci_simulator_pick_existing.sh
          ./tool/ci_simulator_boot_bg.sh

      - name: Setup iOS CI (Flutter + Brewfile + SPM/Flutter caches; Xcode already selected)
        if: needs.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-ios-ci
        with:
          select-xcode: "false"
          flutter: "true"
          ruby: "false"
          brewfile: "true"
          cache-flutter-embed: "true"
          cache-key-suffix: iphone-single

      - name: Prepare Flutter add-to-app frameworks (cached hash skips rebuild)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          if [[ -d Flutter/Debug/Flutter.xcframework ]]; then
            echo "==> Flutter embed cache hit — skip ios-framework rebuild"
            ./tool/prepare_flutter_embed.sh --skip-build
          else
            echo "==> Flutter embed cache miss — building ios-framework"
            ./tool/prepare_flutter_embed.sh
          fi
          # Module unit tests are cheap; keep them off xcodebuild critical path.
          (cd flutter_module && flutter test)

      - name: iPhone build-for-testing
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          CI_SIMULATOR_REUSE_ONLY: "1"
          CI_IPHONE_XCODEBUILD_TIMEOUT_SECONDS: "1800"
          IPHONE_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-iPhone
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-iphone-build-for-testing.sh

      - name: Await simulator boot
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
        run: ./tool/ci_simulator_await.sh

      # Units first (serial): parallel workers previously spent ~27m cloning for
      # unit suites and barely reached UI before the 35m timeout.
      - name: iPhone unit tests (serial)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          CI_IPHONE_GENERIC_BUILD: "0"
          CI_IPHONE_TEST_MODE: test-without-building
          CI_IPHONE_TEST_SHARD: unit
          CI_IPHONE_PRODUCTS_DIR: ${{ runner.temp }}/DerivedData-iPhone/Build/Products
          CI_IPHONE_XCODEBUILD_TIMEOUT_SECONDS: "600"
          CI_ALLOW_PARALLEL_TESTS: "0"
          CI_SIMULATOR_REUSE_ONLY: "1"
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-iphone-test.sh

      - name: iPhone UI tests (parallel workers, UI only)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          CI_IPHONE_GENERIC_BUILD: "0"
          CI_IPHONE_TEST_MODE: test-without-building
          CI_IPHONE_TEST_SHARD: ui
          CI_IPHONE_PRODUCTS_DIR: ${{ runner.temp }}/DerivedData-iPhone/Build/Products
          CI_IPHONE_XCODEBUILD_TIMEOUT_SECONDS: "1500"
          CI_ALLOW_PARALLEL_TESTS: "1"
          CI_PARALLEL_TESTING_WORKER_COUNT: "3"
          CI_SIMULATOR_REUSE_ONLY: "1"
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-iphone-test.sh

  # --- Layout: sharded (compare / fallback) — units in build + 2 UI shards --
  iphone-build:
    name: Checklist · iPhone build
    needs: changes
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.changes.outputs.iphone_layout == 'sharded'
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode + pick existing simulator + start background boot
        env:
          CI: true
          CI_SIMULATOR_REUSE_ONLY: "1"
        run: |
          set -euo pipefail
          source ./tool/select_xcode.sh
          source ./tool/ci_simulator_pick_existing.sh
          ./tool/ci_simulator_boot_bg.sh

      - name: Setup iOS CI (Flutter + Brewfile + SPM/Flutter caches; Xcode already selected)
        uses: ./.github/actions/setup-ios-ci
        with:
          select-xcode: "false"
          flutter: "true"
          ruby: "false"
          brewfile: "true"
          cache-flutter-embed: "true"
          cache-key-suffix: iphone-build

      - name: Prepare Flutter add-to-app frameworks (cached hash skips rebuild)
        run: |
          set -euo pipefail
          if [[ -d Flutter/Debug/Flutter.xcframework ]]; then
            ./tool/prepare_flutter_embed.sh --skip-build
          else
            ./tool/prepare_flutter_embed.sh
          fi
          (cd flutter_module && flutter test)

      - name: iPhone build-for-testing
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          CI_SIMULATOR_REUSE_ONLY: "1"
          CI_IPHONE_XCODEBUILD_TIMEOUT_SECONDS: "1800"
          IPHONE_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-iPhone
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-iphone-build-for-testing.sh

      - name: Await simulator boot
        env:
          CI: true
        run: ./tool/ci_simulator_await.sh

      - name: iPhone unit tests (Swift Testing + XCTest; same job as build)
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          CI_IPHONE_GENERIC_BUILD: "0"
          CI_IPHONE_TEST_MODE: test-without-building
          CI_IPHONE_TEST_SHARD: unit
          CI_IPHONE_PRODUCTS_DIR: ${{ runner.temp }}/DerivedData-iPhone/Build/Products
          CI_IPHONE_XCODEBUILD_TIMEOUT_SECONDS: "600"
          CI_ALLOW_PARALLEL_TESTS: "0"
          CI_SIMULATOR_REUSE_ONLY: "1"
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-iphone-test.sh

      - name: Upload iPhone test products
        uses: actions/upload-artifact@v7
        with:
          name: iphone-test-products
          path: ${{ runner.temp }}/DerivedData-iPhone/Build/Products
          if-no-files-found: error
          retention-days: 1

  iphone-test:
    name: Checklist · iPhone test
    needs: [changes, iphone-build]
    if: >-
      always() &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.iphone-build.result == 'success' &&
      needs.changes.outputs.iphone_layout == 'sharded'
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [ui-a, ui-b]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode + pick existing simulator + start background boot
        env:
          CI: true
          CI_SIMULATOR_REUSE_ONLY: "1"
        run: |
          set -euo pipefail
          source ./tool/select_xcode.sh
          source ./tool/ci_simulator_pick_existing.sh
          ./tool/ci_simulator_boot_bg.sh

      - name: Setup iOS CI (lean — no Brewfile; Xcode already selected)
        uses: ./.github/actions/setup-ios-ci
        with:
          select-xcode: "false"
          brewfile: "false"
          cache-key-suffix: iphone-test-${{ matrix.shard }}

      - name: Download iPhone test products
        uses: actions/download-artifact@v7
        with:
          name: iphone-test-products
          path: ${{ runner.temp }}/iphone-test-products

      - name: Await simulator boot
        env:
          CI: true
        run: ./tool/ci_simulator_await.sh

      - name: iPhone UI tests (test-without-building shard, parallel workers)
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          CI_IPHONE_GENERIC_BUILD: "0"
          CI_IPHONE_TEST_MODE: test-without-building
          CI_IPHONE_TEST_SHARD: ${{ matrix.shard }}
          CI_IPHONE_PRODUCTS_DIR: ${{ runner.temp }}/iphone-test-products
          CI_IPHONE_XCODEBUILD_TIMEOUT_SECONDS: "2100"
          CI_ALLOW_PARALLEL_TESTS: "1"
          CI_PARALLEL_TESTING_WORKER_COUNT: "2"
          CI_SIMULATOR_REUSE_ONLY: "1"
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-iphone-test.sh

  platform-builds:
    name: Checklist · platform builds
    needs: changes
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docs-only platform builds bypass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only diff; iPad/Mac/watchOS builds have no code to compile."

      - name: Setup iOS CI (Flutter + Brewfile + caches)
        if: needs.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-ios-ci
        with:
          flutter: "true"
          ruby: "true"
          brewfile: "true"
          cache-flutter-embed: "true"
          cache-key-suffix: platform
          derived-data-paths: |
            ${{ runner.temp }}/DerivedData-iPad
            ${{ runner.temp }}/DerivedData-Mac

      - name: Prepare Flutter add-to-app frameworks (iPad; Mac skips link)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          if [[ -d Flutter/Debug/Flutter.xcframework ]]; then
            ./tool/prepare_flutter_embed.sh --skip-build
          else
            ./tool/prepare_flutter_embed.sh
          fi

      - name: iPad and Mac builds (warnings as errors)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
          CI_PREPARE_IPHONE: "0"
          CI_SERIAL_PLATFORM_BUILDS: "0"
          IPAD_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-iPad
          MAC_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-Mac
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-platform-builds.sh

  checklist:
    name: Delivery checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, iphone, iphone-build, iphone-test, platform-builds]
    if: ${{ always() }}
    steps:
      - name: Check checklist lanes
        env:
          LAYOUT: ${{ needs.changes.outputs.iphone_layout }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          IPHONE: ${{ needs.iphone.result }}
          IPHONE_BUILD: ${{ needs['iphone-build'].result }}
          IPHONE_TEST: ${{ needs['iphone-test'].result }}
          PLATFORM: ${{ needs['platform-builds'].result }}
        run: |
          set -euo pipefail
          echo "docs_only=$DOCS_ONLY layout=$LAYOUT"

          fail_lane() {
            echo "checklist lane failed: $1 (result=$2)" >&2
            exit 1
          }

          [[ "$CHANGES" == "success" ]] || fail_lane changes "$CHANGES"
          [[ "$LINT" == "success" ]] || fail_lane lint "$LINT"
          [[ "$PLATFORM" == "success" ]] || fail_lane platform-builds "$PLATFORM"

          if [[ "$DOCS_ONLY" == "true" ]]; then
            # Docs-only: single layout reports via iphone bypass; sharded jobs skipped.
            [[ "$IPHONE" == "success" || "$IPHONE" == "skipped" ]] || fail_lane iphone "$IPHONE"
            [[ "$IPHONE_BUILD" == "success" || "$IPHONE_BUILD" == "skipped" ]] || fail_lane iphone-build "$IPHONE_BUILD"
            [[ "$IPHONE_TEST" == "success" || "$IPHONE_TEST" == "skipped" ]] || fail_lane iphone-test "$IPHONE_TEST"
          elif [[ "$LAYOUT" == "single" ]]; then
            [[ "$IPHONE" == "success" ]] || fail_lane iphone "$IPHONE"
            [[ "$IPHONE_BUILD" == "skipped" ]] || fail_lane iphone-build "$IPHONE_BUILD"
            [[ "$IPHONE_TEST" == "skipped" ]] || fail_lane iphone-test "$IPHONE_TEST"
          else
            [[ "$IPHONE" == "skipped" ]] || fail_lane iphone "$IPHONE"
            [[ "$IPHONE_BUILD" == "success" ]] || fail_lane iphone-build "$IPHONE_BUILD"
            [[ "$IPHONE_TEST" == "success" ]] || fail_lane iphone-test "$IPHONE_TEST"
          fi

          echo "Delivery checklist gate passed (layout=$LAYOUT)."
          echo "Local equivalent: ./bin/checklist — see docs/engineering/checklist_gate.md"
