# SwiftLint — superDemoApp (SwiftUI, SwiftData, Swift Concurrency)
# Run: ./bin/lint.sh  |  Autocorrect: ./bin/format.sh
#
# Policy: defaults + high-signal opt-ins for agents / concurrency / a11y / tests.
# Skipped (too noisy or false positives on protocol stubs):
#   unneeded_throws_rethrows — AppIntent.perform / repository stubs require throws
#   no_magic_numbers, missing_docs, one_declaration_per_file, explicit_acl

swiftlint_version: 0.65.1

included:
  - superDemoApp
  - FeedWidgetShared
  - superDemoAppWidget
  - superDemoAppTests
  - superDemoAppUITests

excluded:
  - DerivedData
  - .build
  - "**/*.generated.swift"

analyzer_rules:
  - capture_variable
  - typesafe_array_init
  - unused_declaration
  - unused_import

opt_in_rules:
  # Accessibility
  - accessibility_label_for_image
  - accessibility_trait_for_button

  # Safety / correctness
  - anonymous_argument_in_multiline_closure
  - contains_over_range_nil_comparison
  - discarded_notification_center_observer
  - discouraged_assert
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - empty_collection_literal
  - empty_count
  - empty_string
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - no_empty_block
  - return_value_from_void_function
  - unavailable_function
  - unowned_variable_capture
  - unused_parameter
  - untyped_error_in_catch
  - variable_shadowing
  - yoda_condition

  # Concurrency / modern Swift
  - async_without_await
  - incompatible_concurrency_annotation
  - unhandled_throwing_task
  - unneeded_escaping

  # SwiftUI / UIKit / assets
  - prefer_asset_symbols
  - private_action
  - private_outlet
  - private_subject
  - private_swiftui_state
  - prohibited_interface_builder
  - strong_iboutlet
  - weak_delegate

  # Style / maintainability
  - array_init
  - attributes
  - closure_end_indentation
  - closure_parameter_position
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - direct_return
  - empty_xctest_method
  - explicit_init
  - extension_access_modifier
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - function_default_parameter_at_end
  - joined_default_parameter
  - last_where
  - legacy_objc_type
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_call_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - non_overridable_class_declaration
  - operator_usage_whitespace
  - optional_enum_case_matching
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - period_spacing
  - prefer_condition_list
  - prefer_key_path
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - reduce_into
  - redundant_final
  - redundant_nil_coalescing
  - redundant_type_annotation
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - superfluous_else
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

  # Indentation (pairs with custom swift_two_space_member_indent + SwiftFormat)
  - indentation_width

  # Tests
  - balanced_xctest_lifecycle
  - final_test_case
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - test_case_accessibility
  - xct_specific_matcher

disabled_rules:
  # Length / nesting noise for feature models and SwiftUI bodies — review in PRs.
  - file_length
  - function_body_length
  - function_parameter_count
  - nesting
  - todo
  - type_body_length
  # SwiftFormat owns trailing commas.
  - trailing_comma

indentation_width:
  indentation_width: 4
  include_comments: false

line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60
  excluded:
    # Xcode template names — rename to UpperCamelCase in a dedicated refactor.
    - superDemoAppTests
    - superDemoAppUITests
    - superDemoAppUITestsLaunchTests

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - x
    - y
    - i
    - os

cyclomatic_complexity:
  warning: 12
  error: 20

large_tuple:
  warning: 3
  error: 4

reporter: xcode

custom_rules:
  no_navigation_view:
    name: Prefer NavigationStack
    regex: '\bNavigationView\s*\('
    message: "Use NavigationStack (or NavigationSplitView on macOS) instead of deprecated NavigationView."
    severity: warning

  no_print_debug:
    name: No print() in app code
    regex: '\bprint\s*\('
    message: "Use os.Logger or debug-only logging; avoid print() in committed code."
    severity: warning

  no_force_try:
    name: No force try
    regex: 'try!'
    message: "Handle errors explicitly; avoid try!."
    severity: error

  swiftdata_model_final:
    name: SwiftData @Model must be final class
    regex: '@Model\s*\n\s*(?:public\s+|internal\s+|fileprivate\s+|private\s+)?class\s+(?!final)'
    message: "@Model types should be declared as final class."
    severity: warning

  no_task_detached:
    name: Avoid Task.detached
    regex: '\bTask\s*\.\s*detached\b'
    message: "Avoid Task.detached in app code; use structured tasks, injected services, or an actor-owned task."
    severity: warning

  no_dispatch_main_async:
    name: Prefer MainActor over DispatchQueue.main.async
    regex: '\bDispatchQueue\s*\.\s*main\s*\.\s*async\b'
    message: "Use @MainActor or MainActor.run instead of DispatchQueue.main.async in Swift concurrency code."
    severity: warning

  no_screen_bounds_layout:
    name: No screen-bounds layout
    regex: '\b(?:UIScreen|NSScreen)\s*\.\s*main\b|\bUIScreen\s*\.\s*main\s*\.\s*bounds\b'
    message: "Avoid screen-size layout; use SwiftUI adaptive containers, geometry, and size classes."
    severity: warning

  no_uiapplication_shared:
    name: Avoid UIApplication.shared in universal code
    regex: '\bUIApplication\s*\.\s*shared\b'
    message: "Avoid UIApplication.shared in universal app code; use scene, environment, or platform-specific adapters."
    severity: warning

  no_fixed_appearance_colors:
    name: No Color.white / Color.black
    regex: '\b(?:Color|UIColor)\.(?:white|black)\b'
    message: "Use semantic colors or asset catalog Any Appearance + Dark; fixed white/black breaks light/dark."
    severity: warning

  no_observable_object_new_code:
    name: Prefer Observation over ObservableObject
    regex: '\b(?:ObservableObject|@StateObject|@ObservedObject|@EnvironmentObject)\b'
    message: "Prefer @Observable + @State / @Environment for iOS 17+; keep ObservableObject only for legacy bridges."
    severity: warning

  swift_two_space_member_indent:
    name: Swift member indent must be 4 spaces
    regex: '(?m)^  (?:func |init\(|var |let |case |private |fileprivate |internal |public |@Test|@Suite)'
    message: "Use 4-space Swift indentation (.editorconfig). Run ./bin/format.sh before ./bin/lint.sh. See docs/agent_swift_guards.md."
    severity: error
    match_kinds:
      - identifier
      - keyword
      - typeidentifier
