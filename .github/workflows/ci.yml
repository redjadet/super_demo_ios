name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install lint tools
        run: brew bundle check --file Brewfile || brew bundle --file Brewfile

      - name: Lint
        env:
          CI: true
        run: bundle exec fastlane ci_lint

  iphone-test:
    runs-on: macos-26
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: iPhone tests
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
        run: |
          source ./tool/select_xcode_26_5.sh
          bundle exec fastlane iphone_test

  platform-builds:
    runs-on: macos-26
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: iPad and Mac builds
        env:
          CI: true
          CI_PREPARE_IPHONE: "0"
          CI_SERIAL_PLATFORM_BUILDS: "1"
        run: |
          source ./tool/select_xcode_26_5.sh
          bundle exec fastlane platform_builds

  lint-build-test:
    runs-on: ubuntu-latest
    needs: [lint, iphone-test, platform-builds]
    if: ${{ always() }}
    steps:
      - name: Check CI lanes
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "lint failed or did not complete"
            exit 1
          fi
          if [[ "${{ needs['iphone-test'].result }}" != "success" ]]; then
            echo "iphone-test failed or did not complete"
            exit 1
          fi
          if [[ "${{ needs['platform-builds'].result }}" != "success" ]]; then
            echo "platform-builds failed or did not complete"
            exit 1
          fi
          echo "CI lanes passed."
