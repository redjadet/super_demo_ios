name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR pushes only — never cancel in-progress main runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Newest released Xcode on the xcode-27 image (GM build preferred over seed/beta).
  # Escape: runs-on macos-26 + SUPER_DEMO_XCODE_MIN_VERSION=26.5 (see docs/ci-cd-map.md).
  SUPER_DEMO_XCODE_MIN_VERSION: "27"

jobs:
  # Scope / preflight (flutter_bloc_app `changes` job parity).
  # Unknown/empty diffs → full CI. Docs-only PR diffs skip Xcode work inside
  # lane jobs that still report success so branch protection stays green.
  changes:
    name: Checklist · changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          docs_only="$(./bin/checklist --print-scope)"
          case "$docs_only" in
            docs_only=true|docs_only=false) ;;
            *) echo "Invalid checklist scope: $docs_only" >&2; exit 1 ;;
          esac
          docs_only="${docs_only#docs_only=}"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          {
            echo "## Change scope"
            echo ""
            echo "- event: \`${{ github.event_name }}\`"
            echo "- docs_only: \`$docs_only\`"
            echo "- rule: \`tool/checklist_scope.sh\` (markdown/mdx/rst/adoc + llms.txt)"
            echo "- unknown/empty/mixed/code/workflow diffs take the full route"
          } >> "$GITHUB_STEP_SUMMARY"

  # Delivery checklist lanes (Flutter ./bin/checklist role), parallelized.
  # Local single-command equivalent: ./bin/checklist
  # Docs: docs/engineering/checklist_gate.md
  lint:
    name: Checklist · lint
    needs: changes
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Docs-only lint (no Brewfile / SwiftLint / Xcode)
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          set -euo pipefail
          if ! command -v npm >/dev/null 2>&1 && ! command -v npx >/dev/null 2>&1; then
            echo "error: npx required for DesignMD on docs-only lint" >&2
            exit 1
          fi
          ./bin/lint-markdown.sh
          ./tool/check_design_md.sh
          ./tool/check_checklist_scope.sh
          echo "Docs-only lint route passed."

      - name: Setup iOS CI (Ruby + Brewfile)
        if: needs.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-ios-ci
        with:
          ruby: "true"
          brewfile: "true"
          cache-key-suffix: lint

      - name: Lint (Swift + markdown + DesignMD + common)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
        run: bundle exec fastlane ci_lint

  # Build once — shards download products and run test-without-building.
  iphone-build:
    name: Checklist · iPhone build
    needs: changes
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docs-only iPhone build bypass
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "Documentation-only diff; iPhone build-for-testing has no code to compile."

      - name: Setup iOS CI (Flutter + Brewfile + caches)
        if: needs.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-ios-ci
        with:
          flutter: "true"
          ruby: "true"
          brewfile: "true"
          cache-flutter-embed: "true"
          cache-key-suffix: iphone-build
          derived-data-paths: ${{ runner.temp }}/DerivedData-iPhone

      - name: Prepare Flutter add-to-app frameworks
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          if [[ -d Flutter/Debug/Flutter.xcframework ]]; then
            ./tool/prepare_flutter_embed.sh --skip-build
          else
            ./tool/prepare_flutter_embed.sh
          fi
          (cd flutter_module && flutter test)

      - name: iPhone build-for-testing
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          CI_IPHONE_XCODEBUILD_TIMEOUT_SECONDS: "1800"
          IPHONE_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-iPhone
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-iphone-build-for-testing.sh

      - name: Upload iPhone test products
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: iphone-test-products
          path: ${{ runner.temp }}/DerivedData-iPhone/Build/Products
          if-no-files-found: error
          retention-days: 1

  # Matrix shards are skipped on docs-only (aggregator accepts skipped).
  # Job display names become "Checklist · iPhone test (<shard>)".
  iphone-test:
    name: Checklist · iPhone test
    needs: [changes, iphone-build]
    if: >-
      always() &&
      needs.changes.outputs.docs_only != 'true' &&
      needs.iphone-build.result == 'success'
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [unit-and-app-ui, engineering-a, engineering-b]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup iOS CI (Xcode select + Brewfile for rg / build-phase tools)
        uses: ./.github/actions/setup-ios-ci
        with:
          brewfile: "true"
          cache-key-suffix: iphone-test-${{ matrix.shard }}

      - name: Download iPhone test products
        uses: actions/download-artifact@v7
        with:
          name: iphone-test-products
          path: ${{ runner.temp }}/iphone-test-products

      # Boot while products are already on disk; script also ensures destination.
      - name: Pre-boot iPhone simulator
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
        run: |
          set -euo pipefail
          # Use BASH_SOURCE-safe source from repo path (not runner temp $0).
          source "${GITHUB_WORKSPACE}/tool/ensure_ci_simulator.sh"

      - name: iPhone tests (test-without-building shard)
        env:
          CI: true
          CI_PREPARE_IPAD: "0"
          CI_IPHONE_GENERIC_BUILD: "0"
          CI_IPHONE_TEST_MODE: test-without-building
          CI_IPHONE_TEST_SHARD: ${{ matrix.shard }}
          CI_IPHONE_PRODUCTS_DIR: ${{ runner.temp }}/iphone-test-products
          CI_IPHONE_XCODEBUILD_TIMEOUT_SECONDS: "2100"
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-iphone-test.sh

  platform-builds:
    name: Checklist · platform builds
    needs: changes
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'xcode-27' }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docs-only platform builds bypass
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only diff; iPad/Mac/watchOS builds have no code to compile."

      - name: Setup iOS CI (Flutter + Brewfile + caches)
        if: needs.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-ios-ci
        with:
          flutter: "true"
          ruby: "true"
          brewfile: "true"
          cache-flutter-embed: "true"
          cache-key-suffix: platform
          derived-data-paths: |
            ${{ runner.temp }}/DerivedData-iPad
            ${{ runner.temp }}/DerivedData-Mac

      - name: Prepare Flutter add-to-app frameworks (iPad; Mac skips link)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          if [[ -d Flutter/Debug/Flutter.xcframework ]]; then
            ./tool/prepare_flutter_embed.sh --skip-build
          else
            ./tool/prepare_flutter_embed.sh
          fi

      - name: iPad and Mac builds (warnings as errors)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CI: true
          CI_PREPARE_IPHONE: "0"
          CI_SERIAL_PLATFORM_BUILDS: "0"
          IPAD_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-iPad
          MAC_DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData-Mac
          SUPERDEMO_REQUIRE_FLUTTER_EMBED: "1"
        run: ./bin/ci-platform-builds.sh

  checklist:
    name: Delivery checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, lint, iphone-build, iphone-test, platform-builds]
    if: ${{ always() }}
    steps:
      - name: Check checklist lanes
        run: |
          set -euo pipefail
          docs_only="${{ needs.changes.outputs.docs_only }}"
          echo "docs_only=$docs_only"

          fail_lane() {
            echo "checklist lane failed: $1 (result=$2)" >&2
            exit 1
          }

          [[ "${{ needs.changes.result }}" == "success" ]] || fail_lane changes "${{ needs.changes.result }}"
          [[ "${{ needs.lint.result }}" == "success" ]] || fail_lane lint "${{ needs.lint.result }}"
          [[ "${{ needs['iphone-build'].result }}" == "success" ]] || fail_lane iphone-build "${{ needs['iphone-build'].result }}"
          [[ "${{ needs['platform-builds'].result }}" == "success" ]] || fail_lane platform-builds "${{ needs['platform-builds'].result }}"

          iphone_test_result="${{ needs['iphone-test'].result }}"
          if [[ "$docs_only" == "true" ]]; then
            # Matrix shards are skipped on docs-only; required gate still reports.
            [[ "$iphone_test_result" == "success" || "$iphone_test_result" == "skipped" ]] \
              || fail_lane iphone-test "$iphone_test_result"
          else
            [[ "$iphone_test_result" == "success" ]] || fail_lane iphone-test "$iphone_test_result"
          fi

          echo "Delivery checklist gate passed (changes + lint + iphone-build + iphone-test shards + platform-builds)."
          echo "Local equivalent: ./bin/checklist — see docs/engineering/checklist_gate.md"
